<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Бонусы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--g:rgba(255,255,255,.07);--b:rgba(255,255,255,.13)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,sans-serif;color:#fff;background:radial-gradient(circle at 20% 0%,#3b2a7a 0,transparent 55%),radial-gradient(circle at 90% 100%,#0f4c75 0,transparent 55%),#120d29;padding:16px 16px 40px}
.tabs{display:flex;gap:6px;background:var(--g);border:1px solid var(--b);border-radius:14px;padding:4px;max-width:360px;margin:0 auto 18px}
.tabs button{flex:1;padding:10px;border:0;border-radius:10px;background:none;color:#cfc8ee;font-size:15px;transition:.25s}
.tabs button.on{background:linear-gradient(135deg,#7c4dff,#2ea6ff);color:#fff;box-shadow:0 4px 16px #7c4dff66}
section{display:none;max-width:360px;margin:0 auto;animation:in .4s ease}
section.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.w{position:relative;width:fit-content;margin:8px auto 22px;filter:drop-shadow(0 10px 30px #7c4dff55)}
#ptr{position:absolute;top:-6px;left:50%;margin-left:-13px;border:13px solid transparent;border-top:26px solid #ffd166;filter:drop-shadow(0 2px 4px #0008);transform-origin:50% 0;transition:transform .09s;z-index:2}
.btn{display:block;width:100%;padding:15px;font-size:18px;font-weight:600;border:0;border-radius:14px;color:#fff;background:linear-gradient(135deg,#7c4dff,#2ea6ff);box-shadow:0 8px 24px #7c4dff66;transition:.2s}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.5}
#res{margin:16px 0 0;padding:16px;text-align:center;font-size:20px;font-weight:700;border-radius:16px;background:var(--g);border:1px solid var(--b);opacity:0;transform:translateY(14px);transition:.5s}
#res.on{opacity:1;transform:none}
.card{background:var(--g);border:1px solid var(--b);border-radius:18px;padding:18px;margin-bottom:14px;backdrop-filter:blur(8px)}
.big{font-size:54px;font-weight:800;line-height:1;background:linear-gradient(135deg,#ffd166,#ff8fa3);-webkit-background-clip:text;background-clip:text;color:transparent}
.lbl{font-size:13px;color:#b9b2dd;margin-bottom:6px}
.bar{height:8px;border-radius:8px;background:#ffffff1f;margin-top:14px;overflow:hidden}
#bar{height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,#7c4dff,#2ea6ff);transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.chips{display:flex;gap:8px;margin-bottom:14px}
.chip{flex:1;text-align:center;padding:12px 4px;border-radius:14px;background:var(--g);border:1px solid var(--b)}
.chip b{display:block;font-size:24px}.chip span{font-size:12px;color:#b9b2dd}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #ffffff14;font-size:14px}
.row:last-child{border:0}.row i{width:9px;height:9px;border-radius:50%;flex:none}.row em{margin-left:auto;font-style:normal;color:#b9b2dd;font-size:12px}
#cf{position:fixed;inset:0;pointer-events:none;z-index:9}
body:before,body:after{content:"";position:fixed;z-index:-1;width:60vmax;height:60vmax;border-radius:50%;filter:blur(80px);opacity:.35;animation:fl 14s ease-in-out infinite alternate}
body:before{background:#7c4dff;top:-20vmax;left:-20vmax}
body:after{background:#0ea5e9;bottom:-25vmax;right:-20vmax;animation-delay:-7s}
@keyframes fl{to{transform:translate(8vmax,6vmax) scale(1.15)}}
.w{animation:glow 3s ease-in-out infinite alternate}
@keyframes glow{from{filter:drop-shadow(0 10px 26px #7c4dff44)}to{filter:drop-shadow(0 12px 44px #2ea6ffaa)}}
.btn{position:relative;overflow:hidden}
.btn:not(:disabled):after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#fff5,transparent);transform:skewX(-20deg);animation:shine 3.2s infinite}
@keyframes shine{to{left:130%}}
.card,.chip{box-shadow:0 8px 30px #0004}
#res.on{background:linear-gradient(135deg,#7c4dff33,#2ea6ff33);border-color:#7c4dff88}
.pr{padding:12px 0;border-bottom:1px solid #ffffff14}.pr:last-child{border:0}
.pr .t{display:flex;justify-content:space-between;align-items:center;font-size:14px;gap:8px}
.pr input[type=range]{width:100%;margin:8px 0 0;accent-color:#7c4dff}
.pr.off{opacity:.45}
.sw{font-size:12px;color:#cfc8ee;background:none;border:1px solid var(--b);border-radius:8px;padding:3px 8px}
.kv{display:flex;justify-content:space-between;font-size:14px;padding:6px 0}
.in{width:100%;padding:9px 11px;margin:0 0 6px;background:#ffffff14;border:1px solid var(--b);border-radius:10px;color:#fff;font-size:14px;font-family:inherit}
.in.xs{width:76px;margin:0}
.pr label.lbl{margin:0;display:flex;align-items:center;gap:4px}
.pr .t .in{flex:1}
</style></head><body>
<div class="tabs"><button id="t1">🎡 Колесо</button><button id="t2">📊 Кабинет</button><button id="t3" style="display:none">⚙️ Админ</button></div>

<section id="s1">
  <div class="w"><div id="ptr"></div><canvas id="c"></canvas></div>
  <button class="btn" id="go">Крутить</button>
  <div id="res"></div>
</section>

<section id="s2">
  <div class="card"><div class="lbl">Ваш баланс</div><div class="big" id="bal">0</div>
    <div class="bar"><div id="bar"></div></div><div class="lbl" id="need" style="margin:8px 0 0"></div></div>
  <div class="chips">
    <div class="chip"><b id="a">0</b><span>Подтверждено</span></div>
    <div class="chip"><b id="p">0</b><span>На проверке</span></div>
    <div class="chip"><b id="r">0</b><span>Отклонено</span></div>
  </div>
  <div class="card"><div class="lbl">Последние приглашения</div><div id="h"></div></div>
  <div class="card"><div class="lbl">Мои выигрыши</div><div id="wins"></div></div>
</section>
<section id="s3">
  <div class="card"><div class="lbl">Итоги колеса</div><div id="tot"></div></div>
  <div class="card"><div class="lbl">Призы колеса: шанс в процентах</div><div id="pl"></div><div class="lbl" id="sum" style="margin-top:10px"></div><div style="display:flex;gap:8px;margin-top:10px"><button class="sw" id="add">+ Добавить приз</button><button class="sw" id="norm">Выровнять до 100%</button></div></div>
  <button class="btn" id="save">💾 Сохранить призы</button>
  <div class="card" style="margin-top:14px"><div class="lbl">Топ игроков по тратам</div><div id="top"></div></div>
</section>
<canvas id="cf"></canvas>

<script>
const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand()}
const $=i=>document.getElementById(i),q=new URLSearchParams(location.search),TAU=Math.PI*2;
let snap={};try{snap=JSON.parse(q.get("s")||"{}")}catch(e){}
const live=q.has("api"),hasWheel=q.has("win")||live,isAdmin=q.has("admin");
let liveDone=null;
function tab(n){[1,2,3].forEach(i=>{$("s"+i).classList.toggle("on",i==n);$("t"+i).classList.toggle("on",i==n)})}
$("t1").onclick=()=>tab(1);$("t2").onclick=()=>tab(2);$("t3").onclick=()=>tab(3);
if(!hasWheel){$("t1").style.display="none"}
tab(isAdmin?3:live?(q.get("tab")==="cab"?2:1):hasWheel?1:2);

/* ---------- кабинет ---------- */
function countUp(el,to){const t0=performance.now();(function f(t){const p=Math.min((t-t0)/900,1);el.textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)}
const b=snap.b||0,c=snap.c||10;
countUp($("bal"),b);setTimeout(()=>$("bar").style.width=Math.min(100,b/c*100)+"%",100);
$("need").textContent=b>=c?"Хватает на крутку колеса 🎉":"До следующей крутки не хватает: "+(c-b);
$("a").textContent=snap.a||0;$("p").textContent=snap.p||0;$("r").textContent=snap.r||0;
const ST={approved:["#4ade80","Подтверждена"],pending:["#facc15","На проверке"],rejected:["#f87171","Отклонена"]};
const hs=snap.h||[];
if(!hs.length){$("h").textContent="Пока пусто";$("h").style.color="#b9b2dd"}
hs.forEach(([d,n,s])=>{const r=document.createElement("div");r.className="row";
  const i=document.createElement("i");i.style.background=(ST[s]||ST.pending)[0];
  const t=document.createElement("span");t.textContent=n;
  const e=document.createElement("em");e.textContent=(ST[s]||ST.pending)[1]+" · "+d.slice(5);
  r.append(i,t,e);$("h").append(r)});

/* ---------- колесо ---------- */
let L=(q.get("labels")||"Приз 1|Приз 2|Приз 3|Приз 4").split("|"),n=L.length,seg=TAU/n;
let win=Math.min(Math.max(+q.get("win")||0,0),n-1),res=q.get("res")||L[win],good=q.get("good")==="1";
const key="spin_"+(q.get("id")||"test");
const cv=$("c"),S=Math.min(innerWidth-32,340),d=devicePixelRatio||1;
cv.width=cv.height=S*d;cv.style.width=cv.style.height=S+"px";
const x=cv.getContext("2d");x.scale(d,d);
const PAL=[["#ff6b6b","#c92a5b"],["#ffb84d","#f76707"],["#3ddc97","#0b8f6a"],["#4dabf7","#2459c4"],["#b388ff","#6a3fd1"],["#ffe066","#e0a800"]];
let rot=0,lit=0;
function draw(){
  const R=S/2,r=R-16;x.clearRect(0,0,S,S);
  x.beginPath();x.arc(R,R,R-2,0,TAU);x.fillStyle="#241a52";x.fill();
  for(let i=0;i<24;i++){const a=i/24*TAU,on=(i+lit)%2==0;
    x.beginPath();x.arc(R+Math.cos(a)*(R-8),R+Math.sin(a)*(R-8),3,0,TAU);
    x.shadowColor="#ffd166";x.shadowBlur=on?10:0;x.fillStyle=on?"#ffd166":"#6b5d2e";x.fill()}
  x.shadowBlur=0;
  for(let i=0;i<n;i++){
    const a=rot+i*seg,m=a+seg/2,[c1,c2]=PAL[i%PAL.length];
    const g=x.createLinearGradient(R,R,R+Math.cos(m)*r,R+Math.sin(m)*r);g.addColorStop(0,c2);g.addColorStop(1,c1);
    x.beginPath();x.moveTo(R,R);x.arc(R,R,r,a,a+seg);x.closePath();x.fillStyle=g;x.fill();
    x.strokeStyle="#ffffff55";x.lineWidth=1.5;x.stroke();
    x.save();x.translate(R,R);x.rotate(m);x.textAlign="right";x.fillStyle="#fff";x.shadowColor="#0006";x.shadowBlur=4;
    let f=17;do{x.font="700 "+f+"px system-ui,sans-serif";f--}while(x.measureText(L[i]).width>r*.62&&f>9);
    x.fillText(L[i],r-14,5);x.restore();
  }
  const gl=x.createRadialGradient(R*.7,R*.55,5,R,R,r);gl.addColorStop(0,"#ffffff48");gl.addColorStop(.55,"#ffffff00");
  x.beginPath();x.arc(R,R,r,0,TAU);x.fillStyle=gl;x.fill();
  const h=x.createRadialGradient(R-4,R-4,2,R,R,22);h.addColorStop(0,"#fff3b0");h.addColorStop(1,"#e0a800");
  x.beginPath();x.arc(R,R,22,0,TAU);x.fillStyle=h;x.shadowColor="#0008";x.shadowBlur=10;x.fill();x.shadowBlur=0;
}
const COLS=["#ffd166","#ff6b6b","#4dabf7","#3ddc97","#b388ff"];
function confetti(){
  const k=$("cf"),g=k.getContext("2d");k.width=innerWidth;k.height=innerHeight;
  const P=Array.from({length:110},()=>({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*13-4,s:5+Math.random()*5,c:COLS[Math.random()*5|0],r:Math.random()*6}));
  let t=0;(function f(){g.clearRect(0,0,k.width,k.height);
    P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.25;g.fillStyle=p.c;g.save();g.translate(p.x,p.y);g.rotate(p.r);g.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);g.restore()});
    ++t<160?requestAnimationFrame(f):g.clearRect(0,0,k.width,k.height)})();
}
function finish(){
  if(live&&liveDone){liveDone();return}
  $("res").textContent=(good?"🎉 ":"")+"Вы выиграли: "+res;$("res").classList.add("on");
  $("go").textContent="Закрыть";$("go").disabled=false;$("go").onclick=()=>tg?tg.close():window.close();
  try{localStorage.setItem(key,"1")}catch(e){}
  if(tg&&tg.HapticFeedback)tg.HapticFeedback.notificationOccurred(good?"success":"warning");
  if(good)confetti();
}
function spin(){
  $("go").disabled=true;
  const c=(win+.5+(Math.random()-.5)*.7)*seg;
  const base=(((-Math.PI/2-c-rot)%TAU)+TAU)%TAU;
  const from=rot,to=rot+7*TAU+base,t0=performance.now(),T=6000;let last=-1;
  (function f(t){
    const p=Math.min((t-t0)/T,1);rot=from+(to-from)*(1-Math.pow(1-p,4));lit=Math.floor((t-t0)/120);draw();
    const idx=Math.floor((((-Math.PI/2-rot)%TAU)+TAU)%TAU/seg);
    if(idx!==last){if(last>=0){$("ptr").style.transform="rotate(-16deg)";setTimeout(()=>$("ptr").style.transform="",80);
      if(tg&&tg.HapticFeedback)tg.HapticFeedback.selectionChanged()}last=idx}
    p<1?requestAnimationFrame(f):finish();
  })(t0);
}
if(hasWheel&&!live){
  draw();let seen=false;try{seen=localStorage.getItem(key)}catch(e){}
  if(seen)finish();else $("go").onclick=spin;
}
if(live){
  const API=q.get("api"),AUTH="tma "+(tg?tg.initData:"");
  const call=p=>fetch(API+"/api/"+p,{method:"POST",headers:{Authorization:AUTH}}).then(r=>r.json());
  const row=(t,m,c)=>{const r=document.createElement("div");r.className="row";const i=document.createElement("i");i.style.background=c;const s=document.createElement("span");s.textContent=t;const e=document.createElement("em");e.textContent=m;r.append(i,s,e);return r};
  const fill=(box,arr,mk,empty)=>{box.textContent="";if(!arr.length){box.textContent=empty;box.style.color="#b9b2dd";return}box.style.color="";arr.forEach(a=>box.append(mk(a)))};
  let bal=0,cost=10;
  function renderCab(s){
    const b=s.b||0,c=s.c||10;
    countUp($("bal"),b);$("bar").style.width=Math.min(100,b/c*100)+"%";
    $("need").textContent=b>=c?"Хватает на крутку колеса 🎉":"До следующей крутки не хватает: "+(c-b);
    $("a").textContent=s.a||0;$("p").textContent=s.p||0;$("r").textContent=s.r||0;
    fill($("h"),s.h||[],([d,n,st])=>row(n,(ST[st]||ST.pending)[1]+" · "+d.slice(5),(ST[st]||ST.pending)[0]),"Пока пусто");
    fill($("wins"),s.wins||[],([d,pz])=>row(pz,d.slice(5),"#7c4dff"),"Вы ещё не крутили колесо");
  }
  const setGo=()=>{$("go").disabled=false;$("go").textContent="Крутить · "+cost+" бонусов (у вас "+bal+")"};
  const say=t=>{$("res").textContent=t;$("res").classList.add("on")};
  async function load(){
    let s;try{s=await call("me")}catch(e){say("Нет связи с сервером. Попробуйте позже.");return}
    if(s.error){say("Откройте приложение из бота, чтобы войти.");return}
    bal=s.b;cost=s.c;renderCab(s);
    if(s.labels&&s.labels.length){L=s.labels;n=L.length;seg=TAU/n}
    draw();setGo();
  }
  liveDone=async()=>{
    say((good?"🎉 ":"")+"Вы выиграли: "+res);
    if(tg&&tg.HapticFeedback)tg.HapticFeedback.notificationOccurred(good?"success":"warning");
    if(good)confetti();
    await load();
  };
  $("go").onclick=async()=>{
    $("go").disabled=true;$("res").classList.remove("on");
    let r;try{r=await call("spin")}catch(e){say("Нет связи с сервером.");setGo();return}
    if(r.error){say(r.error==="balance"?"Не хватает бонусов":r.error==="sub"?"Подпишитесь на канал и откройте снова":r.error==="setup"?"Колесо пока не настроено":"Ошибка входа");await load();return}
    L=r.labels;n=L.length;seg=TAU/n;win=r.win;res=r.res;good=!!r.good;bal=r.balance;
    spin();
  };
  draw();load();
}
if(isAdmin){
  $("t3").style.display="";$("t1").style.display="none";$("t2").style.display="none";
  let A={};try{A=JSON.parse(q.get("a")||"{}")}catch(e){}
  const T=A.t||{};
  const P=(A.p||[]).map(p=>({id:p[0],name:p[1],short:p[2],w:p[3],b:p[4],f:!!p[5],pct:0}));
  const tw=P.reduce((a,p)=>a+p.w,0)||1;P.forEach(p=>p.pct=+(p.w/tw*100).toFixed(1));
  const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
  const kv=(k,v)=>{const r=el("div","kv"),b=el("b","",v);r.append(el("span","",k),b);return r};
  [["Круток",T.n||0],["Потрачено бонусов",T.sp||0],["Выплачено бонусами",T.bw||0],["Призов выдаёт менеджер",T.it||0]].forEach(([k,v])=>$("tot").append(kv(k,v)));
  const sum=()=>P.reduce((a,p)=>a+(+p.pct||0),0);
  function upd(){const s=sum();$("sum").textContent="Сумма: "+s.toFixed(1)+"% · призов: "+P.length+" (от 2 до 12)";$("sum").style.color=Math.abs(s-100)<.06?"#4ade80":"#facc15"}
  function inp(ph,val,on,cls){const i=el("input","in"+(cls?" "+cls:""));i.placeholder=ph;i.value=val;i.oninput=()=>on(i.value);return i}
  function render(){
    $("pl").textContent="";
    P.forEach((p,k)=>{
      const r=el("div","pr"),h1=el("div","t");
      const del=el("button","sw","✕");del.onclick=()=>{if(P.length<=2)return;P.splice(k,1);render()};
      h1.append(inp("Название приза",p.name,v=>p.name=v),del);
      const sh=inp("Подпись на колесе (коротко)",p.short,v=>p.short=v);
      const pc=el("div","t"),pv=el("b","",p.pct+"%");pc.append(el("span","lbl","Шанс выпадения"),pv);
      const rg=el("input");rg.type="range";rg.min=0;rg.max=100;rg.step=.5;rg.value=p.pct;
      rg.oninput=()=>{p.pct=+rg.value;pv.textContent=p.pct+"%";upd()};
      const ex=el("div","t"),bo=inp("0",p.b,v=>p.b=Math.max(0,+v||0),"xs");bo.type="number";
      const lb=el("label","lbl"),cb=el("input");cb.type="checkbox";cb.checked=p.f;cb.onchange=()=>p.f=cb.checked;lb.append(cb," выдаёт менеджер");
      ex.append(el("span","lbl","+ бонусов"),bo,lb);
      r.append(h1,sh,pc,rg,ex);$("pl").append(r)});
    upd();
  }
  $("add").onclick=()=>{if(P.length>=12)return;P.push({id:0,name:"Новый приз",short:"🎁 Приз",w:0,b:0,f:true,pct:0});render()};
  $("norm").onclick=()=>{const s=sum();P.forEach(p=>p.pct=s>0?+(p.pct/s*100).toFixed(1):+(100/P.length).toFixed(1));render()};
  render();
  (A.top||[]).forEach(([n,c,sp,bw,it])=>{const r=el("div","row"),e=el("em","",c+" круток · −"+sp+" · +"+bw+(it?" · призов "+it:""));r.append(el("span","",n),e);$("top").append(r)});
  if(!(A.top||[]).length){$("top").textContent="Пока нет круток";$("top").style.color="#b9b2dd"}
  $("save").onclick=()=>{const s=sum();if(s<=0){alert("Задайте шанс хотя бы одному призу");return}
    const d=JSON.stringify({a:"prizes",p:P.map(p=>[p.id,(p.name||"").trim()||"Приз",(p.short||"").trim()||"Приз",Math.round(p.pct/s*1000),p.b,p.f?1:0])});
    if(tg)tg.sendData(d);else alert(d)};
}
</script></body></html>
